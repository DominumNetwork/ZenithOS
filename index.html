<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ZenithOS</title>
    <meta name="description" content="A sleek, distraction-free WebOS desktop environment with multi-window multitasking, unblocked games library, terminal, code studio, and tab cloaking." />
    <meta property="og:title" content="ZenithOS" />
    <meta property="og:description" content="A sleek, distraction-free WebOS desktop environment with multi-window multitasking, unblocked games library, terminal, code studio, and tab cloaking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link id="app-favicon" rel="icon" href="https://cdn.jsdelivr.net/gh/DominumNetwork/Dominum@main/src/assets/images/transparent-dominum.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="select-none overflow-hidden m-0 p-0 w-screen h-screen bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="wallpaper-wrapper" class="absolute inset-0 z-0 pointer-events-none overflow-hidden transition-all duration-300">
      <div id="wallpaper-image" class="absolute inset-0 bg-cover bg-center transition-all duration-300 transform scale-105"></div>
      <video id="wallpaper-video" class="hidden absolute inset-0 w-full h-full object-cover transition-opacity duration-500" loop muted playsinline></video>
      <canvas id="wallpaper-canvas" class="absolute inset-0 w-full h-full pointer-events-none opacity-40"></canvas>
      <div id="wallpaper-overlay" class="absolute inset-0 bg-black/25 pointer-events-none transition-opacity duration-300"></div>
      <div id="wallpaper-vignette"></div>
    </div>

    <div id="desktop" class="relative z-10 w-full h-full flex flex-col overflow-hidden">
      <header id="topbar">
        <div class="flex items-center gap-1">
          <div class="relative menu-dropdown-container">
            <button id="zenith-logo-btn" class="px-2 py-1 rounded hover:bg-white/10 transition-colors flex items-center gap-1.5 font-bold text-xs" aria-label="System Menu">
              <i class="fa-solid fa-atom text-accent"></i>
              <span class="font-semibold tracking-wide ml-0.5">Zenith</span>
            </button>
            <div id="zenith-system-menu" class="menu-dropdown hidden absolute top-full left-0 mt-1 w-56 z-50 text-xs">
              <button class="menu-item" data-action="about"><i class="fa-solid fa-circle-info mr-2 opacity-70"></i>About ZenithOS</button>
              <div class="menu-divider"></div>
              <button class="menu-item" data-action="settings"><i class="fa-solid fa-sliders mr-2 opacity-70"></i>System Settings...</button>
              <button class="menu-item" data-action="cloaker"><i class="fa-solid fa-shield-halved mr-2 opacity-70"></i>Privacy &amp; Cloaking</button>
              <button class="menu-item" data-action="spotlight"><i class="fa-solid fa-magnifying-glass mr-2 opacity-70"></i>Spotlight Search <span class="ml-auto opacity-40 text-[10px]">⌘K</span></button>
              <div class="menu-divider"></div>
              <button class="menu-item" data-action="toggle-fullscreen"><i class="fa-solid fa-expand mr-2 opacity-70"></i>Toggle Fullscreen</button>
              <button class="menu-item" data-action="lock"><i class="fa-solid fa-lock mr-2 opacity-70"></i>Lock Desktop</button>
              <button class="menu-item" data-action="restart"><i class="fa-solid fa-rotate-right mr-2 opacity-70"></i>Restart Session</button>
            </div>
          </div>

          <div class="relative menu-dropdown-container">
            <button class="menu-bar-btn">File</button>
            <div class="menu-dropdown hidden absolute top-full left-0 mt-1 w-48 z-50 text-xs">
              <button class="menu-item" data-action="open-files"><i class="fa-regular fa-folder-open mr-2 opacity-70"></i>Open Files</button>
              <button class="menu-item" data-action="open-terminal"><i class="fa-solid fa-terminal mr-2 opacity-70"></i>New Terminal</button>
              <button class="menu-item" data-action="open-code"><i class="fa-solid fa-code mr-2 opacity-70"></i>New Script</button>
              <div class="menu-divider"></div>
              <button class="menu-item" data-action="close-active-window"><i class="fa-solid fa-xmark mr-2 opacity-70"></i>Close Window</button>
            </div>
          </div>

          <div class="relative menu-dropdown-container">
            <button class="menu-bar-btn">View</button>
            <div class="menu-dropdown hidden absolute top-full left-0 mt-1 w-52 z-50 text-xs">
              <button class="menu-item" data-action="toggle-icons"><i class="fa-regular fa-clone mr-2 opacity-70"></i>Toggle Desktop Icons</button>
              <button class="menu-item" data-action="toggle-clock"><i class="fa-regular fa-clock mr-2 opacity-70"></i>Toggle Desktop Clock</button>
              <button class="menu-item" data-action="cycle-wallpaper"><i class="fa-regular fa-image mr-2 opacity-70"></i>Next Wallpaper</button>
              <button class="menu-item" data-action="toggle-zen"><i class="fa-solid fa-moon mr-2 opacity-70"></i>Toggle Zen Mode</button>
            </div>
          </div>

          <div class="relative menu-dropdown-container">
            <button class="menu-bar-btn">Go</button>
            <div class="menu-dropdown hidden absolute top-full left-0 mt-1 w-48 z-50 text-xs">
              <button class="menu-item" data-action="open-games"><i class="fa-solid fa-gamepad mr-2 opacity-70"></i>Games Hub</button>
              <button class="menu-item" data-action="open-browser"><i class="fa-solid fa-globe mr-2 opacity-70"></i>Web Browser</button>
              <button class="menu-item" data-action="open-music"><i class="fa-solid fa-music mr-2 opacity-70"></i>Audio Lounge</button>
              <button class="menu-item" data-action="open-terminal"><i class="fa-solid fa-terminal mr-2 opacity-70"></i>Terminal</button>
              <button class="menu-item" data-action="open-settings"><i class="fa-solid fa-gear mr-2 opacity-70"></i>Settings</button>
            </div>
          </div>

          <div class="relative menu-dropdown-container">
            <button class="menu-bar-btn">Window</button>
            <div class="menu-dropdown hidden absolute top-full left-0 mt-1 w-48 z-50 text-xs">
              <button class="menu-item" data-action="minimize-all"><i class="fa-solid fa-window-minimize mr-2 opacity-70"></i>Minimize All</button>
              <button class="menu-item" data-action="restore-all"><i class="fa-solid fa-window-restore mr-2 opacity-70"></i>Restore All</button>
              <button class="menu-item" data-action="cascade-windows"><i class="fa-solid fa-layer-group mr-2 opacity-70"></i>Cascade Windows</button>
              <button class="menu-item" data-action="close-all"><i class="fa-solid fa-trash-can mr-2 opacity-70"></i>Close All Windows</button>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div id="topbar-live-wp" class="hidden items-center gap-1.5 px-2 py-0.5 rounded bg-white/10 text-[11px] text-slate-300">
            <i class="fa-solid fa-film text-accent text-xs"></i>
            <span id="topbar-live-title" class="truncate max-w-[120px]">Live Motion</span>
            <button id="topbar-live-toggle" class="hover:text-white"><i class="fa-solid fa-pause text-[10px]"></i></button>
          </div>

          <button id="topbar-audio-btn" class="flex items-center gap-1.5 px-2 py-1 rounded hover:bg-white/10 transition-colors opacity-80 hover:opacity-100" title="Audio Lounge">
            <i class="fa-solid fa-volume-high text-xs"></i>
          </button>

          <div class="flex items-center gap-1 text-slate-300 opacity-80" title="Network Connected">
            <i class="fa-solid fa-wifi text-xs"></i>
          </div>

          <div id="battery-indicator" class="flex items-center gap-1 text-slate-300 opacity-80 text-[11px]" title="Battery">
            <span id="battery-pct">98%</span>
            <i class="fa-solid fa-battery-three-quarters text-xs text-emerald-400"></i>
          </div>

          <button id="control-center-toggle" class="p-1 rounded hover:bg-white/10 transition-colors opacity-80 hover:opacity-100" title="Control Center">
            <i class="fa-solid fa-sliders text-xs"></i>
          </button>

          <button id="topbar-clock-btn" class="font-medium hover:bg-white/10 px-2 py-1 rounded transition-colors tracking-tight text-slate-200">
            <span id="topbar-date" class="mr-1.5 opacity-75">Fri Oct 9</span>
            <span id="topbar-time">7:38 AM</span>
          </button>
        </div>
      </header>

      <main id="workspace" class="relative flex-1 w-full h-[calc(100vh-2rem)] overflow-hidden">
        <div id="desktop-icons-layer"></div>

        <div id="desktop-clock-widget" class="absolute inset-0 flex flex-col pointer-events-none z-0 select-none transition-opacity duration-300 clock-large pos-centre height-centre">
          <div id="clock-greeting" class="text-sm md:text-base font-medium tracking-widest uppercase opacity-75 drop-shadow-md text-slate-200 mb-1">
            Welcome to ZenithOS
          </div>
          <div id="desktop-clock-time" class="text-6xl md:text-8xl font-bold tracking-tight text-white drop-shadow-2xl">
            07:38 <span class="text-2xl md:text-3xl font-medium opacity-80">AM</span>
          </div>
          <div id="desktop-clock-date" class="text-base md:text-lg font-medium opacity-85 text-slate-200 drop-shadow mt-2">
            Friday, October 9
          </div>
        </div>

        <div id="windows-container" class="absolute inset-0 pointer-events-none z-20"></div>
      </main>

      <footer id="dock-container" class="absolute bottom-3 left-0 right-0 flex justify-center items-center z-40 pointer-events-none">
        <div id="dock">
          <div class="dock-item" data-app="files" data-tooltip="Files">
            <div class="dock-icon bg-gradient-to-br from-amber-400 to-amber-600">
              <i class="fa-solid fa-folder-closed"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-item" data-app="games" data-tooltip="Games Hub">
            <div class="dock-icon bg-gradient-to-br from-purple-500 to-indigo-700">
              <i class="fa-solid fa-gamepad"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-item" data-app="terminal" data-tooltip="Terminal">
            <div class="dock-icon bg-gradient-to-br from-slate-800 to-slate-950 border border-white/10">
              <i class="fa-solid fa-terminal text-emerald-400"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-item" data-app="browser" data-tooltip="Web Browser">
            <div class="dock-icon bg-gradient-to-br from-sky-400 to-blue-600">
              <i class="fa-solid fa-globe"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-item" data-app="code" data-tooltip="Zenith Code">
            <div class="dock-icon bg-gradient-to-br from-cyan-500 to-teal-700">
              <i class="fa-solid fa-code"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-item" data-app="music" data-tooltip="Audio Lounge">
            <div class="dock-icon bg-gradient-to-br from-rose-500 to-pink-600">
              <i class="fa-solid fa-music"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-separator w-[1px] h-8 bg-white/15 mx-1 self-center"></div>

          <div class="dock-item" data-app="settings" data-tooltip="Settings">
            <div class="dock-icon bg-gradient-to-br from-zinc-600 to-zinc-800 border border-white/10">
              <i class="fa-solid fa-sliders text-slate-200"></i>
            </div>
            <div class="dock-indicator"></div>
          </div>

          <div class="dock-item" data-app="spotlight" data-tooltip="Search (⌘K)">
            <div class="dock-icon bg-gradient-to-br from-indigo-500 to-purple-600">
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <div id="control-center" class="hidden absolute top-10 right-3 w-80 rounded-2xl bg-slate-900/90 backdrop-blur-3xl border border-white/15 shadow-2xl p-4 z-50 text-xs select-none">
      <div class="text-sm font-bold text-white mb-3 flex items-center justify-between">
        <span>Control Center</span>
        <button id="close-control-center" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-3">
        <button id="toggle-cloak-btn" class="quick-toggle p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center gap-2.5 transition-colors">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div class="text-left">
            <div class="font-semibold text-slate-100">Tab Cloak</div>
            <div id="cloak-status-text" class="text-[10px] text-slate-400">Disabled</div>
          </div>
        </button>

        <button id="toggle-theme-btn" class="quick-toggle p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center gap-2.5 transition-colors">
          <div class="w-8 h-8 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-palette"></i>
          </div>
          <div class="text-left">
            <div class="font-semibold text-slate-100">Theme</div>
            <div id="theme-status-text" class="text-[10px] text-slate-400">Midnight</div>
          </div>
        </button>

        <button id="toggle-mute-btn" class="quick-toggle p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center gap-2.5 transition-colors">
          <div class="w-8 h-8 rounded-lg bg-rose-500/20 text-rose-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-volume-high" id="mute-icon"></i>
          </div>
          <div class="text-left">
            <div class="font-semibold text-slate-100">Audio</div>
            <div id="audio-status-text" class="text-[10px] text-slate-400">Active</div>
          </div>
        </button>

        <button id="toggle-live-wp-btn" class="quick-toggle p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center gap-2.5 transition-colors">
          <div class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-film"></i>
          </div>
          <div class="text-left">
            <div class="font-semibold text-slate-100">Live Wallpaper</div>
            <div id="live-wp-status-text" class="text-[10px] text-slate-400">Still</div>
          </div>
        </button>
      </div>

      <div class="p-3 rounded-xl bg-white/5 border border-white/10 mb-3 space-y-3">
        <div>
          <div class="flex justify-between text-[11px] text-slate-300 mb-1">
            <span>Glass Blur</span>
            <span id="blur-val-text">0px</span>
          </div>
          <input type="range" id="quick-blur-slider" min="0" max="32" value="0" class="w-full" />
        </div>
        <div>
          <div class="flex justify-between text-[11px] text-slate-300 mb-1">
            <span>Wallpaper Dim</span>
            <span id="dim-val-text">15%</span>
          </div>
          <input type="range" id="quick-dim-slider" min="0" max="85" value="15" class="w-full" />
        </div>
      </div>

      <div class="flex justify-between items-center text-[11px] text-slate-400 px-1">
        <span>ZenithOS 2.0</span>
        <button id="quick-open-settings" class="text-accent hover:underline">All Settings &rarr;</button>
      </div>
    </div>

    <div id="spotlight-modal" class="hidden fixed inset-0 z-50 flex items-start justify-center pt-24 bg-black/60 backdrop-blur-md">
      <div class="w-full max-w-xl rounded-2xl bg-slate-900/90 backdrop-blur-3xl border border-white/20 shadow-2xl overflow-hidden">
        <div class="flex items-center px-4 py-3.5 border-b border-white/10 gap-3">
          <i class="fa-solid fa-magnifying-glass text-slate-400 text-lg"></i>
          <input type="text" id="spotlight-input" placeholder="Search apps, games, files, or evaluate math (e.g. 42 * 18)..." class="w-full bg-transparent text-white placeholder-slate-400 text-sm focus:outline-none" autofocus />
          <kbd class="text-[10px] bg-white/10 px-2 py-0.5 rounded text-slate-400">ESC</kbd>
        </div>
        <div id="spotlight-results" class="max-h-80 overflow-y-auto p-2 space-y-1 text-xs"></div>
      </div>
    </div>

    <div id="context-menu" class="hidden fixed z-50 w-52 rounded-xl bg-slate-900/95 backdrop-blur-2xl border border-white/15 shadow-2xl py-1.5 text-xs select-none">
      <button class="context-item" data-action="open-games"><i class="fa-solid fa-gamepad mr-2 opacity-70"></i>Games Hub</button>
      <button class="context-item" data-action="open-terminal"><i class="fa-solid fa-terminal mr-2 opacity-70"></i>Open Terminal</button>
      <button class="context-item" data-action="open-files"><i class="fa-regular fa-folder-open mr-2 opacity-70"></i>File Explorer</button>
      <button class="context-item" data-action="open-code"><i class="fa-solid fa-code mr-2 opacity-70"></i>Zenith Code</button>
      <div class="menu-divider"></div>
      <button class="context-item" data-action="cycle-wallpaper"><i class="fa-regular fa-image mr-2 opacity-70"></i>Change Wallpaper</button>
      <button class="context-item" data-action="settings"><i class="fa-solid fa-sliders mr-2 opacity-70"></i>System Settings</button>
      <div class="menu-divider"></div>
      <button class="context-item" data-action="toggle-fullscreen"><i class="fa-solid fa-expand mr-2 opacity-70"></i>Fullscreen Mode</button>
    </div>

    <div id="lock-screen" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/85 backdrop-blur-3xl text-white select-none">
      <div class="w-20 h-20 rounded-full bg-accent/20 border border-accent/40 flex items-center justify-center text-3xl text-accent mb-4">
        <i class="fa-solid fa-atom"></i>
      </div>
      <div class="text-4xl font-bold tracking-tight mb-1" id="lock-time">07:38 AM</div>
      <div class="text-sm text-slate-300 opacity-80 mb-8" id="lock-date">Friday, October 9</div>
      <button id="unlock-btn" class="px-6 py-2.5 rounded-xl bg-accent hover:bg-accent-hover text-white font-medium text-sm shadow-lg shadow-accent/30 transition-all flex items-center gap-2">
        <i class="fa-solid fa-lock-open text-xs"></i> Unlock Desktop
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
